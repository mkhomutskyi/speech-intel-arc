services:
  stt:
    build: .
    image: speech-intel-arc:20261019
    restart: unless-stopped
    command: ["uvicorn", "stt:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    devices:
      - "${CARD_DEVICE:?Set CARD_DEVICE}:${CARD_DEVICE}"
      - "${RENDER_DEVICE:?Set RENDER_DEVICE}:${RENDER_DEVICE}"
    group_add: ["${RENDER_GID:?Set RENDER_GID}"]
    volumes: ["${SPEECH_DATA:-./data}/models:/models:ro", "stt-cache:/root/.cache"]
    environment:
      OV_DEVICE: "${OV_DEVICE:-GPU}"
      EXPECTED_GPU_NAME: "${EXPECTED_GPU_NAME:-Arc}"
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
  speech:
    image: speech-intel-arc:20261019
    restart: unless-stopped
    depends_on:
      stt:
        condition: service_healthy
    ports: ["${SPEECH_BIND:-127.0.0.1}:${SPEECH_PORT:-8880}:8000"]
    devices:
      - "${CARD_DEVICE:?Set CARD_DEVICE}:${CARD_DEVICE}"
      - "${RENDER_DEVICE:?Set RENDER_DEVICE}:${RENDER_DEVICE}"
    group_add: ["${RENDER_GID:?Set RENDER_GID}"]
    volumes: ["${SPEECH_DATA:-./data}/models:/models:ro", "tts-cache:/root/.cache"]
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      STT_URL: http://stt:8001
      SPEECH_API_KEY: "${SPEECH_API_KEY:-}"
      XPU_DEVICE: "${XPU_DEVICE:-xpu:0}"
      EXPECTED_GPU_NAME: "${EXPECTED_GPU_NAME:-Arc}"
      TTS_AMP: "${TTS_AMP:-fp32}"
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
volumes:
  stt-cache:
  tts-cache:
